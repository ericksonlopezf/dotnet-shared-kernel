name: Publish NuGet

on:
  push:
    tags:
      - "v*.*.*"         # Triggers on: v1.0.0, v1.2.3, v2.0.0-preview.1

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  publish:
    name: Pack & Publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        # Strip the 'v' prefix: v1.2.3 → 1.2.3
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore Strong Name key
        env:
          SNK_KEY: ${{ secrets.SNK_KEY }}
        run: |
          if [ -n "$SNK_KEY" ]; then
            echo "$SNK_KEY" | tr -d '\n\r ' | base64 --decode > EricksonLopez.SharedKernel.snk
          fi

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build --no-restore --configuration Release

      - name: Run tests before publish
        run: dotnet test --no-build --configuration Release

      - name: Pack
        run: >
          dotnet pack src/EricksonLopez.SharedKernel/EricksonLopez.SharedKernel.csproj
          --no-build
          --configuration Release
          --output ./nupkgs
          -p:VersionPrefix=${{ steps.version.outputs.VERSION }}

      - name: Generate Sigstore Provenance Attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: './nupkgs/*.nupkg'

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ericksonlopezf

      - name: Push to NuGet.org
        run: >
          dotnet nuget push ./nupkgs/*.nupkg
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Release ${{ steps.version.outputs.VERSION }}
          generate_release_notes: false
          body: |
            ## Products in this release

            - **EricksonLopez.SharedKernel** `${{ steps.version.outputs.VERSION }}` – [CHANGELOG](https://github.com/ericksonlopezf/dotnet-shared-kernel/blob/${{ github.ref_name }}/CHANGELOG.md)

            ---

            For detailed changes, see the linked changelog above.

            ### Installation

            ```bash
            dotnet add package EricksonLopez.SharedKernel --version ${{ steps.version.outputs.VERSION }}
            ```
          files: ./nupkgs/*.nupkg
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
