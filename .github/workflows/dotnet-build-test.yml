name: Reusable — .NET Build & Test

on:
  workflow_call:
    inputs:
      dotnet-version:
        description: ".NET SDK version to use"
        required: false
        type: string
        default: "10.0.x"
      test-filter:
        description: "Test filter expression (e.g., Category!=Integration)"
        required: false
        type: string
        default: ""
      test-project:
        description: "Specific test project path (leave empty to run all)"
        required: false
        type: string
        default: ""
      upload-coverage:
        description: "Whether to upload code coverage artifacts"
        required: false
        type: boolean
        default: true
      artifact-name:
        description: "Name for the test results artifact"
        required: false
        type: string
        default: "test-results"
    secrets:
      SNK_KEY:
        description: "Base64-encoded Strong Name key (.snk) for assembly signing"
        required: false
      CODECOV_TOKEN:
        description: "Codecov upload token for coverage reporting"
        required: false
      SONAR_TOKEN:
        description: "SonarCloud token for analysis"
        required: false

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Restore Strong Name key
        env:
          SNK_KEY: ${{ secrets.SNK_KEY }}
        run: |
          if [ -n "$SNK_KEY" ]; then
            echo "$SNK_KEY" | tr -d '\n\r ' | base64 --decode > EricksonLopez.snk
          fi

      - name: Restore
        run: dotnet restore

      - name: Setup Java (for SonarScanner)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Install SonarScanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Begin Sonar Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: env.SONAR_TOKEN != ''
        run: |
          dotnet sonarscanner begin /k:"EricksonLopez_${{ github.event.repository.name }}" /o:"ericksonlopez" /d:sonar.login="$SONAR_TOKEN" /d:sonar.host.url="https://sonarcloud.io" /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml"

      - name: Build (Release)
        run: dotnet build --no-restore --configuration Release

      - name: Run tests
        run: >
          dotnet test
          ${{ inputs.test-project }}
          --no-build
          --configuration Release
          ${{ inputs.test-filter != '' && format('--filter "{0}"', inputs.test-filter) || '' }}
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./test-results
          --collect:"XPlat Code Coverage"

      - name: Install Stryker
        run: dotnet tool install -g dotnet-stryker

      - name: Run Stryker Mutation Testing
        run: dotnet stryker

      - name: End Sonar Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: always() && env.SONAR_TOKEN != ''
        run: dotnet sonarscanner end /d:sonar.login="$SONAR_TOKEN"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ./test-results/

      - name: Upload coverage to Codecov
        if: always() && inputs.upload-coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: "**/coverage.cobertura.xml"
          fail_ci_if_error: false
          flags: unittests
          name: codecov-${{ inputs.artifact-name }}
