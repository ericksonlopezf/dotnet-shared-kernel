name: Reusable — .NET Build & Test

on:
  workflow_call:
    inputs:
      dotnet-version:
        description: ".NET SDK version to use"
        required: false
        type: string
        default: "10.0.x"
      test-filter:
        description: "Test filter expression (e.g., Category!=Integration)"
        required: false
        type: string
        default: ""
      test-project:
        description: "Specific test project path (leave empty to run all)"
        required: false
        type: string
        default: ""
      upload-coverage:
        description: "Whether to upload code coverage artifacts"
        required: false
        type: boolean
        default: true
      artifact-name:
        description: "Name for the test results artifact"
        required: false
        type: string
        default: "test-results"

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build --no-restore --configuration Release

      - name: Run tests
        run: >
          dotnet test
          ${{ inputs.test-project }}
          --no-build
          --configuration Release
          ${{ inputs.test-filter != '' && format('--filter "{0}"', inputs.test-filter) || '' }}
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./test-results
          --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
          path: ./test-results/

      - name: Upload coverage
        if: always() && inputs.upload-coverage
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}-coverage
          path: "**/coverage.cobertura.xml"
